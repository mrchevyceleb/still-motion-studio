<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#f4f3ee"/>
<script>
  (() => {
    let saved;
    try { saved = localStorage.getItem('still.theme'); } catch {}
    const theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme;
    document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#141d19' : '#f4f3ee';
  })();
</script>
<style>html{background:#f4f3ee}html[data-theme='dark']{background:#141d19;color:#e5eddf}</style>
<meta name="description" content="Still — a simpler way to bring characters to life. Import, pose, and make your next move."/><link rel="icon" type="image/svg+xml" href="/favicon.svg"/><title>Still · Motion made simple</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
